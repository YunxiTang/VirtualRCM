[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrcm"
version = "0.1.0"
description = "Virtual Remote Center of Motion (V-RCM) controller for surgical robots in MuJoCo"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "mujoco>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "scipy>=1.10", "matplotlib>=3.7"]
viz = ["viser>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
